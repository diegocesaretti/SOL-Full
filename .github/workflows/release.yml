name: SOL-Full release

on:
  push:
    tags:
      - "sol-full-v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  SOL_FULL_UPSTREAM_TOKEN: ${{ secrets.SOL_FULL_UPSTREAM_TOKEN }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout SOL-Full
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify private upstream access is configured
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SOL_FULL_UPSTREAM_TOKEN)) {
            throw 'Missing Actions secret SOL_FULL_UPSTREAM_TOKEN. It needs read-only Contents access to diegocesaretti/SOL and diegocesaretti/Whatsapp-Codex-Nexo.'
          }

      - name: Assemble exact pinned release bundle
        shell: pwsh
        run: ./scripts/assemble-full.ps1

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            dist/SOL-Full-Windows-*.zip
            dist/SHA256SUMS.txt
