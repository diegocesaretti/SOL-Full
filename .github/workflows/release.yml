name: SOL-Full release

on:
  push:
    tags:
      - "sol-full-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout SOL-Full
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build pinned upstream components
        shell: pwsh
        run: ./scripts/build-components.ps1

      - name: Assemble SOL-Full bundle
        shell: pwsh
        run: ./scripts/assemble-full.ps1

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            dist/SOL-Full-Windows-*.zip
            dist/SHA256SUMS.txt
